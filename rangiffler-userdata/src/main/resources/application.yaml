server:
  port: 8089
grpc:
  server:
    port: 8088
    max-inbound-message-size: 1MB
spring:
  application:
    name: rangiffler-userdata
  datasource:
    hikari:
      connection-timeout: 20000
      minimum-idle: 10
      maximum-pool-size: 30
      idle-timeout: 10000
      max-lifetime: 1000
      auto-commit: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    schemas: rangiffler-userdata
    locations: classpath:db/migration/rangiffler-userdata
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          lob:
            non_contextual_creation: true
    database-platform: org.hibernate.dialect.MySQL8Dialect
    show-sql: false
    generate-ddl: true
    open-in-view: false
  cloud:
    compatibility-verifier:
      enabled: false
logging:
  file:
    path: ./logs/rangiffler-userdata
  level:
    root: ERROR
    org.springframework.kafka: ERROR
    org.springframework.web: ERROR
    org.springframework.boot.autoconfigure: ERROR

---
spring:
  config:
    activate:
      on-profile: 'local'
  datasource:
    url: 'jdbc:mysql://localhost:3306/rangiffler-userdata?serverTimezone=UTC&createDatabaseIfNotExist=true'
    username: root
    password: secret
  kafka:
    bootstrap-servers: 'localhost:9092'
    consumer:
      group-id: 'userdata'
      auto-offset-reset: earliest
grpc:
  client:
    grpcGeoClient:
      address: 'static://localhost:8092'
      negotiationType: PLAINTEXT
---
spring:
  config:
    activate:
      on-profile: 'docker'
  datasource:
    url: 'jdbc:mysql://rangiffler-all-db:3306/rangiffler-userdata?serverTimezone=UTC&createDatabaseIfNotExist=true'
    username: root
    password: secret
  kafka:
    bootstrap-servers: 'kafka:9092'
    consumer:
      group-id: 'userdata'
      auto-offset-reset: earliest

grpc:
  client:
    grpcGeoClient:
      address: 'static://geo.rangiffler.dc:8092'
      negotiationType: PLAINTEXT