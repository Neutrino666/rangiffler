server:
  port: 8093

grpc:
  server:
    port: 8094
    max-inbound-message-size: 1MB

spring:
  application:
    name: rangiffler-photo
  datasource:
    hikari:
      connection-timeout: 20000
      minimum-idle: 10
      maximum-pool-size: 30
      idle-timeout: 10000
      max-lifetime: 1000
      auto-commit: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    schemas: rangiffler-photo
    locations: classpath:db/migration/rangiffler-photo
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        generate_statistics: true
        format_sql: true
        jdbc:
          lob:
            non_contextual_creation: true
    database-platform: org.hibernate.dialect.MySQL8Dialect
    show-sql: false
    generate-ddl: true
    open-in-view: false
  cloud:
    compatibility-verifier:
      enabled: false
logging:
  file:
    path: ./logs/rangiffler-photo

  level:
    root: INFO
    org.springframework.web: DEBUG
    org.springframework.boot.autoconfigure: DEBUG
    org.hibernate.stat: DEBUG

---
spring:
  config:
    activate:
      on-profile: 'local'
  datasource:
    url: 'jdbc:mysql://localhost:3306/rangiffler-photo?serverTimezone=UTC&createDatabaseIfNotExist=true'
    username: root
    password: secret

grpc:
  client:
    grpcUserdataClient:
      address: 'static://localhost:8088'
      negotiationType: PLAINTEXT
---
spring:
  config:
    activate:
      on-profile: 'docker'
  datasource:
    url: 'jdbc:mysql://rangiffler-all-db:3306/rangiffler-photo?serverTimezone=UTC&createDatabaseIfNotExist=true'
    username: root
    password: secret

grpc:
  client:
    grpcUserdataClient:
      address: 'static://userdata.rangiffler.dc:8088'
      negotiationType: PLAINTEXT