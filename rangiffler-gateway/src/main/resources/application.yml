server:
  port: 8080

spring:
  application:
    name: rangiffler-gateway
  cloud:
    compatibility-verifier:
      enabled: false
  graphql:
    graphiql:
      enabled: true
    schema:
      introspection:
        enabled: true
  datasource:
    hikari:
      connection-timeout: 20000
      minimum-idle: 10
      maximum-pool-size: 30
      idle-timeout: 10000
      max-lifetime: 1000
      auto-commit: true
    username: root
    password: secret
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    schemas: rangiffler-gateway
    locations: classpath:db/migration/rangiffler-gateway
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        generate_statistics: true
        format_sql: true
        jdbc:
          lob:
            non_contextual_creation: true
    database-platform: org.hibernate.dialect.MySQL8Dialect
    show-sql: false
    generate-ddl: true
    open-in-view: false

logging:
  file:
    path: ./logs/rangiffler-gateway
  level:
    root: INFO
    org.springframework.web: ERROR
    org.springframework.security: ERROR
    org.springframework.security.oauth2: ERROR
    org.springframework.boot.autoconfigure: ERROR
    org.hibernate.stat: DEBUG
dgs:
  graphql:
    schema-locations:
      - "classpath*:graphql/**/*.graphql*"

---
spring:
  config:
    activate:
      on-profile: 'local'
  datasource:
    url: 'jdbc:mysql://localhost:3306/rangiffler-gateway?serverTimezone=UTC&createDatabaseIfNotExist=true'
    username: root
    password: secret
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: 'http://localhost:9000'

grpc:
  client:
    grpcUserdataClient:
      address: 'static://localhost:8088'
      negotiationType: PLAINTEXT
    grpcGeoClient:
      address: 'static://localhost:8092'
      negotiationType: PLAINTEXT
    grpcPhotoClient:
      address: 'static://localhost:8094'
      negotiationType: PLAINTEXT

rangiffler-front:
  base-uri: 'http://localhost:3001'
rangiffler-gateway:
  base-uri: 'http://localhost:8080'

---
spring:
  config:
    activate:
      on-profile: 'docker'
  datasource:
    url: 'jdbc:mysql://rangiffler-all-db:3306/rangiffler-gateway?serverTimezone=UTC&createDatabaseIfNotExist=true'
    username: root
    password: secret
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: 'http://auth.rangiffler.dc:9000'

grpc:
  client:
    grpcUserdataClient:
      address: 'static://userdata.rangiffler.dc:8088'
      negotiationType: PLAINTEXT
    grpcGeoClient:
      address: 'static://geo.rangiffler.dc:8092'
      negotiationType: PLAINTEXT
    grpcPhotoClient:
      address: 'static://photo.rangiffler.dc:8094'
      negotiationType: PLAINTEXT

rangiffler-front:
  base-uri: 'http://frontend.rangiffler.dc'
rangiffler-gateway:
  base-uri: 'http://gateway.rangiffler.dc:8080'
