server:
  port: 9000
  error:
    whitelabel:
      enabled: false
    path: /error
  servlet:
    session:
      timeout: 60m
      cookie:
        name: JSESSIONID
        max-age: 1800
      tracking-modes: cookie

spring:
  application:
    name: rangiffler-auth
  cloud:
    compatibility-verifier:
      enabled: false
  mvc:
    log-request-details: true
  web:
    resources:
      cache:
        cachecontrol:
          max-age: 365d
  datasource:
    hikari:
      connection-timeout: 20000
      minimum-idle: 10
      maximum-pool-size: 30
      idle-timeout: 10000
      max-lifetime: 1000
      auto-commit: true
    username: root
    password: secret
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    schemas: rangiffler-auth
    locations: classpath:db/migration/rangiffler-auth
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        generate_statistics: true
        format_sql: true
        jdbc:
          lob:
            non_contextual_creation: true
    database-platform: org.hibernate.dialect.MySQL8Dialect
    show-sql: false
    generate-ddl: true
    open-in-view: false

logging:
  file:
    path: ./logs/rangiffler-auth
  level:
    root: INFO
    org.springframework.kafka: ERROR
    org.springframework.web: ERROR
    org.springframework.security: ERROR
    org.springframework.security.oauth2: ERROR
    org.hibernate.stat: DEBUG

---
spring:
  config:
    activate:
      on-profile: 'local'
  kafka:
    bootstrap-servers: 'localhost:9092'
  datasource:
    url: 'jdbc:mysql://localhost:3306/rangiffler-auth?serverTimezone=UTC&createDatabaseIfNotExist=true'
    username: root
    password: secret
  security:
    oauth2:
      authorizationserver:
        client:
          oidc-client:
            registration:
              client-id: "client"
              client-authentication-methods:
                - "none"
              authorization-grant-types:
                - "authorization_code"
              redirect-uris:
                - "http://localhost:3001/authorized"
              post-logout-redirect-uris:
                - "http://localhost:3001/logout"
              scopes:
                - "openid"
                - "profile"
            require-authorization-consent: true
            require-proof-key: true
            token-settings:
              access-token-time-to-live: 1800
              authorization-code-time-to-live: 1800
rangiffler-front:
  base-uri: 'http://localhost:3001'
rangiffler-auth:
  base-uri: 'http://localhost:9000'
  rp-id: 'localhost'
webauthn:
  enabled: true

---
spring:
  config:
    activate:
      on-profile: 'docker'
  kafka:
    bootstrap-servers: 'kafka:9092'
  datasource:
    url: 'jdbc:mysql://rangiffler-all-db:3306/rangiffler-auth?serverTimezone=UTC&createDatabaseIfNotExist=true'
    username: root
    password: secret
  security:
    oauth2:
      authorizationserver:
        client:
          oidc-client:
            registration:
              client-id: "client"
              client-authentication-methods:
                - "none"
              authorization-grant-types:
                - "authorization_code"
              redirect-uris:
                - "http://frontend.rangiffler.dc/authorized"
              post-logout-redirect-uris:
                - "http://frontend.rangiffler.dc/logout"
              scopes:
                - "openid"
                - "profile"
            require-authorization-consent: true
            require-proof-key: true
            token-settings:
              access-token-time-to-live: 1800
              authorization-code-time-to-live: 1800
rangiffler-front:
  base-uri: 'http://frontend.rangiffler.dc'
rangiffler-auth:
  base-uri: 'http://auth.rangiffler.dc:9000'
  rp-id: 'http host not supported'
webauthn:
  enabled: false