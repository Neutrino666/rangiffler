services:

  rangiffler-all-db:
    container_name: rangiffler-all-db
    image: mysql:8.4.7
    environment:
      - CREATE_DATABASES=rangiffler-auth,rangiffler-gateway
      - MYSQL_ROOT_PASSWORD=secret
    volumes:
      - ./mysql/script:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", 'mysqladmin', 'ping', '-h', 'localhost', '-u', 'root', '-p$$MYSQL_ROOT_PASSWORD' ]
      interval: 3s
      timeout: 3s
      retries: 5
    ports:
      - 3306:3306
    command:
      - --max_connections=100
    networks:
      - rangiffler-network

  zookeeper:
    container_name: zookeeper
    image: confluentinc/cp-zookeeper:7.3.2
    ports:
      - 2181:2181
    environment:
      - ZOOKEEPER_CLIENT_PORT=2181
    networks:
      - rangiffler-network

  kafka:
    container_name: kafka
    image: confluentinc/cp-kafka:7.3.2
    ports:
      - 9092:9092
    depends_on:
      zookeeper:
        condition: service_started
    environment:
      - KAFKA_BROKER_ID=1
      - KAFKA_ZOOKEEPER_CONNECT=zookeeper:2181
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
    networks:
      - rangiffler-network

  auth.rangiffler.dc:
    container_name: auth.rangiffler.dc
    image: ${PREFIX}/rangiffler-auth-docker:latest
    ports:
      - 9000:9000
    environment:
      - JAVA_TOOL_OPTIONS=-XX:InitialHeapSize=512m -XX:MaxHeapSize=768m
      - LOG_PATH=/logs/rangiffler-auth/app.log
    volumes:
      - ./logs/rangiffler-auth:/logs/rangiffler-auth
    healthcheck:
      test: "wget --spider http://localhost:9000/actuator/health || exit 1"
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always
    depends_on:
      rangiffler-all-db:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - rangiffler-network

  gateway.rangiffler.dc:
    container_name: gateway.rangiffler.dc
    image: ${PREFIX}/rangiffler-gateway-docker:latest
    ports:
      - 8080:8080
    environment:
      - JAVA_TOOL_OPTIONS=-XX:InitialHeapSize=384m -XX:MaxHeapSize=512m
      - LOG_PATH=/logs/rangiffler-gateway/app.log
    volumes:
      - ./logs/rangiffler-gateway:/logs/rangiffler-gateway
    healthcheck:
      test: "wget --spider http://localhost:8080/actuator/health || exit 1"
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always
    depends_on:
      auth.rangiffler.dc:
        condition: service_healthy
    networks:
      - rangiffler-network

  userdata.rangiffler.dc:
    container_name: userdata.rangiffler.dc
    image: ${PREFIX}/rangiffler-userdata-docker:latest
    ports:
      - 8089:8089
      - 8088:8088
    environment:
      - JAVA_TOOL_OPTIONS=-XX:InitialHeapSize=384m -XX:MaxHeapSize=512m
      - LOG_PATH=/logs/rangiffler-userdata/app.log
    volumes:
      - ./logs/rangiffler-userdata:/logs/rangiffler-userdata
    restart: always
    depends_on:
      rangiffler-all-db:
        condition: service_healthy
    networks:
      - rangiffler-network

  geo.rangiffler.dc:
    container_name: geo.rangiffler.dc
    image: ${PREFIX}/rangiffler-geo-docker:latest
    ports:
      - 8091:8091
      - 8092:8092
    environment:
      - JAVA_TOOL_OPTIONS=-XX:InitialHeapSize=384m -XX:MaxHeapSize=512m
      - LOG_PATH=/logs/rangiffler-geo/app.log
    volumes:
      - ./logs/rangiffler-geo:/logs/rangiffler-geo
    restart: always
    depends_on:
      rangiffler-all-db:
        condition: service_healthy
    networks:
      - rangiffler-network

  photo.rangiffler.dc:
    container_name: photo.rangiffler.dc
    image: ${PREFIX}/rangiffler-photo-docker:latest
    ports:
      - 8093:8093
      - 8094:8094
    environment:
      - JAVA_TOOL_OPTIONS=-XX:InitialHeapSize=384m -XX:MaxHeapSize=512m
      - LOG_PATH=/logs/rangiffler-photo/app.log
    volumes:
      - ./logs/rangiffler-photo:/logs/rangiffler-photo
    restart: always
    depends_on:
      rangiffler-all-db:
        condition: service_healthy
    networks:
      - rangiffler-network

  frontend.rangiffler.dc:
    container_name: frontend.rangiffler.dc
    image: ${PREFIX}/rangiffler-gql-client-docker:latest
    build:
      context: ./rangiffler-gql-client
      dockerfile: ./Dockerfile
      args:
        NPM_COMMAND: build:docker
    ports:
      - 80:80
    depends_on:
      gateway.rangiffler.dc:
        condition: service_started
    networks:
      - rangiffler-network

  rangiffler-e-2-e:
    profiles: [ test ]
    container_name: rangiffler-e-2-e
    image: ${PREFIX}/rangiffler-e-2-e-tests:latest
    build:
      context: ./
      dockerfile: ./rangiffler-e-2-e-tests/Dockerfile
    environment:
      - ALLURE_DOCKER_API=${ALLURE_DOCKER_API:-http://allure:5050}
      - BUILD_URL=${BUILD_URL:-http://allure:5252}
      - HEAD_COMMIT_MESSAGE=${HEAD_COMMIT_MESSAGE:-not_exist_commit_message}
      - EXECUTION_TYPE=${EXECUTION_TYPE:-regress}
      - BROWSER=${BROWSER}
    volumes:
      - ./rangiffler-e-2-e-tests/.screen-output/screenshots/selenoid:/home/gradle/rangiffler-ng-10/rangiffler-e-2-e-tests/.screen-output/screenshots/selenoid
      - ./logs:/home/gradle/rangiffler-ng-10/logs
    depends_on:
      frontend.rangiffler.dc:
        condition: service_started
    networks:
      - rangiffler-network

  selenoid:
    profiles:
      - test
    container_name: selenoid
    image: adtechqatools/selenoid:latest-release
    platform: linux/${ARCH}
    volumes:
      - ./selenoid:/etc/selenoid
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - TZ=Europe/Moscow
    restart: unless-stopped
    command: [ "-conf", "/etc/selenoid/browsers.json", "-limit", "3", "-video-output-dir", "/opt/selenoid/video", "-log-output-dir", "/opt/selenoid/logs", "-container-network", "rangiffler_rangiffler-network" ]
    ports:
      - 4444:4444
    networks:
      - rangiffler-network

  selenoid-ui:
    profiles:
      - test
    container_name: selenoid-ui
    image: aerokube/selenoid-ui:1.10.11
    depends_on:
      - selenoid
    restart: unless-stopped
    ports:
      - 9091:8080
    command: [ "--selenoid-uri", "http://selenoid:4444" ]
    networks:
      - rangiffler-network

  allure:
    profiles:
      - test
    container_name: allure
    image: frankescobar/allure-docker-service:2.27.0
    environment:
      - CHECK_RESULTS_EVERY_SECONDS=NONE
      - KEEP_HISTORY=1
    volumes:
      - allure-results:/app/allure-results
    ports:
      - 5050:5050
    networks:
      - rangiffler-network

  allure-ui:
    profiles:
      - test
    container_name: allure-ui
    image: frankescobar/allure-docker-service-ui:7.0.3
    depends_on:
      - allure
    environment:
      - ALLURE_DOCKER_PUBLIC_API_URL=http://localhost:5050
    ports:
      - 5252:5252
    networks:
      - rangiffler-network

networks:
  rangiffler-network:
    driver: bridge

volumes:
  allure-results:
    external: true